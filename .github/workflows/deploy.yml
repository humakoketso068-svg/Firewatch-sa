# Builds the web version of Firewatch and deploys it to Vercel on every push to main.
# One-time setup: add a repository secret named VERCEL_TOKEN (see README, "Deploy to Vercel").
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install "flet[all]>=1.0.0"

      - name: Build the web app (Python runs in the browser)
        run: flet build web

      - name: Deploy to Vercel
        run: |
          mkdir -p dist/firewatch
          cp -r build/web/. dist/firewatch/
          npx --yes vercel@latest deploy dist/firewatch --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
